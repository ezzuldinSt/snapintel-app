[package]
name = "snapintel-desktop"
description = "SnapIntel: look up public Snapchat profiles and save their media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "snapintel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
snapintel-core = { path = "../core" }
# custom-protocol: the interface in ../ui is always built into the program, so a plain
# `cargo build` gives a working app and no dev server is needed.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
