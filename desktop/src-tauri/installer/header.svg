<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 57" width="150" height="57">
  <!-- The picture at the right of the header on the Windows installer's inner pages (150 x 57).
       Its background is #16161a, the colour of the header. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="50%" r="60%">
      <stop offset="0" stop-color="#ffdf3d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffdf3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="150" height="57" fill="#16161a"/>
  <rect width="150" height="57" fill="url(#glow)"/>
  <text x="97" y="33.5" text-anchor="end" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="14.5" font-weight="700" letter-spacing="-.1" fill="#ffffff">SnapIntel</text>
  <g transform="translate(103 10.5) scale(.0352)">
    <rect x="72" y="72" width="880" height="880" rx="212" fill="url(#tile)" stroke="#3a3a45" stroke-width="14"/>
    <circle cx="456" cy="456" r="190" fill="none" stroke="url(#glass)" stroke-width="78"/>
    <path d="M604 604 752 752" fill="none" stroke="url(#glass)" stroke-width="92" stroke-linecap="round"/>
    <circle cx="456" cy="456" r="66" fill="url(#glass)"/>
  </g>
</svg>
