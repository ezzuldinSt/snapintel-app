[package]
name = "snapintel-core"
description = "Reads public Snapchat profile pages (profile, story, highlights, Spotlight, lenses) and downloads their media with a verifiable manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "http2", "charset"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt", "macros"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tempfile = "3"
