# Weekly check that snapchat.com still matches the paths SnapIntel reads (`snapintel --self-check`).
# A failure here means Snapchat changed its page: the log names each field that no longer resolves
# and the keys found instead. The desktop app has the same check under Settings.
# It needs network access to snapchat.com, which can also fail from GitHub's runners for unrelated reasons.
name: self-check

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

defaults:
  run:
    working-directory: cli

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Check the page layout against snapchat.com
        run: snapintel --self-check
